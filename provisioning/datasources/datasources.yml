apiVersion: 1

datasources:
  - name: TStore Datasource
    type: transpara-tstore-datasource
    access: proxy
    jsonData:
      url: '${GF_DATASOURCE_URL}'
      tokenUrl: '${GF_DATASOURCE_TOKEN_URL}'
      clientId: '${GF_DATASOURCE_CLIENT_ID}'
    secureJsonData:
      clientSecret: '${GF_DATASOURCE_CLIENT_SECRET}'
