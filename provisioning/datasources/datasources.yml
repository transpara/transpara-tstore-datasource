apiVersion: 1

datasources:
  - name: TStore Datasource
    type: transpara-tstore-datasource
    access: proxy
    jsonData:
      url: 'https://tstore.internal:8080'
      tokenUrl: 'https://keycloak.internal/realms/transpara/protocol/openid-connect/token'
      clientId: 'tstore-grafana'
    secureJsonData:
      # Set GF_DATASOURCE_CLIENT_SECRET in your environment or .env file. Do not commit real secrets.
      clientSecret: ${GF_DATASOURCE_CLIENT_SECRET}
