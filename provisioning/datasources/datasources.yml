apiVersion: 1

datasources:
  - name: TStore Datasource
    type: transpara-tstore-datasource
    access: proxy
    jsonData:
      url: 'https://tstore.internal:8080'
      tokenUrl: 'https://keycloak.internal/realms/transpara/protocol/openid-connect/token'
      clientId: 'tstore-grafana'
    secureJsonData:
      # IMPORTANT: Do not commit real secrets here. Use environment variables or Grafana provisioning secrets.
      clientSecret: 'changeme'
