name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Builds an UNSIGNED plugin archive. The plugin is distributed by side-loading,
      # not through the Grafana catalog, so no signing step is used — see docs/development.md.
      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.0.2
        with:
          attestation: true
